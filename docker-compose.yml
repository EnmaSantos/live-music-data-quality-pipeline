services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: data_referee
      POSTGRES_USER: data_referee
      POSTGRES_PASSWORD: data_referee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_referee -d data_referee"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://data_referee:data_referee@db:5432/data_referee
      DATA_REFEREE_API_KEY: ${DATA_REFEREE_API_KEY:-local-development-key}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.start

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://data_referee:data_referee@db:5432/data_referee
      DATA_REFEREE_API_KEY: ${DATA_REFEREE_API_KEY:-local-development-key}
      DATA_REFEREE_API_URL: http://api:8000
      RENDER_SERVICE_NAME: data-referee-app
      PORT: "8501"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
      - worker
    command: python -m app.start

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://data_referee:data_referee@db:5432/data_referee
      RENDER_SERVICE_NAME: data-referee-worker
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.start

volumes:
  postgres_data:
